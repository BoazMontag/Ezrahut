<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2250">
<title>אזרחות פיקסל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#1d1a2f;--cream:#fff8e7;--sky:#6ecbff;--grass:#7bd85a;--yel:#ffd23f;--pink:#ff6fa5;--pur:#8f5cff;--org:#ff9f1c;--red:#ff4d5e;--grn:#2ec27e;--blue:#3a86ff;--bg:#2b2250}
*{box-sizing:border-box}
html,body{margin:0;direction:rtl;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background-color:var(--bg);background-image:radial-gradient(#ffffff22 1px,transparent 1px),radial-gradient(#ffffff14 1px,transparent 1px);background-size:24px 24px,40px 40px;background-position:0 0,12px 20px}
#app{max-width:480px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
.px{font-family:'Press Start 2P','Rubik',monospace;letter-spacing:0}
svg{image-rendering:pixelated;display:inline-block;vertical-align:middle}
h1,h2,h3{margin:.2em 0}
.box{background:var(--cream);box-shadow:0 0 0 4px var(--ink),6px 6px 0 4px #0006;margin:16px 4px;padding:12px 14px;line-height:1.55}
.center{text-align:center}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;background:var(--yel);color:var(--ink);padding:12px 14px;margin:8px 0;width:100%;cursor:pointer;box-shadow:0 0 0 3px var(--ink),inset -4px -4px 0 #0003,inset 4px 4px 0 #fff8;text-align:center}
.btn:active{transform:translate(2px,2px)}
.btn.pink{background:var(--pink)}.btn.grn{background:var(--grn);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.gray{background:#c9c3dd}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
/* HUD */
.hud{display:flex;align-items:center;gap:8px;color:#fff;font-size:11px;margin:4px 0 8px}
.hud .lv{background:var(--pur);padding:6px 6px 5px;box-shadow:0 0 0 2px var(--ink)}
.xpbar{flex:1;height:14px;background:#0005;box-shadow:0 0 0 2px var(--ink);position:relative}
.xpbar i{display:block;height:100%;background:var(--yel);box-shadow:inset 0 -3px 0 #0003}
.hud .ttl{font-size:12px;font-family:'Rubik';font-weight:600;opacity:.9}
.icb{background:none;border:0;font-size:18px;cursor:pointer;padding:2px}
/* map */
.title{color:#fff;text-align:center;margin:8px 0 2px;font-size:28px;font-weight:800;text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink)}
.subt{color:#d9d2ff;text-align:center;font-size:13px;margin-bottom:8px}
.map{position:relative;margin:12px 0;background:linear-gradient(#6ecbff 0 18%,#7bd85a 18%);box-shadow:0 0 0 4px var(--ink),6px 6px 0 4px #0006;overflow:hidden}
.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,#0000000d 50%,transparent 50%),linear-gradient(#0000000d 50%,transparent 50%);background-size:16px 16px}
.map .cloud{position:absolute;top:14px;width:48px;height:12px;background:#fff;box-shadow:12px -8px 0 #fff,24px 0 0 #fff}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translateX(-50%);width:150px;border:0;background:var(--c);color:#fff;font:inherit;padding:8px 6px 6px;cursor:pointer;box-shadow:0 0 0 3px var(--ink),inset -4px -4px 0 #0003,inset 4px 4px 0 #fff5;text-align:center;line-height:1.25}
.node:active{transform:translateX(-50%) translate(2px,2px)}
.node .ic{font-size:24px;display:block}
.node .nn{position:absolute;top:-10px;right:-10px;background:var(--yel);color:var(--ink);font-size:10px;padding:4px 5px;box-shadow:0 0 0 2px var(--ink)}
.node .nm{display:block;font-weight:800;font-size:13px;text-shadow:1px 1px 0 #0006}
.node .ns{display:block;font-size:9px;margin-top:4px;color:var(--yel);text-shadow:1px 1px 0 #0008}
/* world */
.stage{display:flex;align-items:center;gap:12px;text-align:right}
.stage .si{font-size:30px}
.stage .sd{font-weight:400;font-size:13px;opacity:.8}
.stage .stars{margin-inline-start:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 7px;background:#fff;box-shadow:0 0 0 2px var(--ink)}
.chip.w{background:#ffd0d5}.chip.g{background:#c8f5d9}
/* run */
.top{display:flex;align-items:center;gap:10px;margin-top:4px}
.x{background:var(--cream);border:0;font-weight:800;width:34px;height:34px;box-shadow:0 0 0 3px var(--ink);cursor:pointer;font-size:16px}
.bar{flex:1;height:16px;background:#0005;box-shadow:0 0 0 3px var(--ink)}
.bar i{display:block;height:100%;background:var(--grn);box-shadow:inset 0 -4px 0 #0003;transition:width .3s}
.hearts{display:flex;gap:3px;color:#fff}
.sub{display:flex;justify-content:space-between;color:#fff;font-size:12px;margin:10px 2px 0;align-items:center}
.sub .px{font-size:10px;color:var(--yel)}
.arena{position:relative;text-align:center;margin:14px 0 4px;min-height:110px}
.arena .mon{animation:bob 1.2s steps(2) infinite}
.arena.hit .mon{animation:hit .4s steps(4)}
.arena.dead .mon{animation:die .6s steps(6) forwards}
.hp{width:60%;margin:6px auto 0;height:12px;background:#0005;box-shadow:0 0 0 3px var(--ink)}
.hp i{display:block;height:100%;background:var(--red);transition:width .3s}
.dmg{position:absolute;left:50%;top:20px;color:var(--yel);font-size:16px;text-shadow:2px 2px 0 var(--ink);animation:up .8s forwards;pointer-events:none}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hit{0%,50%{filter:brightness(3)}25%,75%{transform:translateX(-6px)}100%{transform:none}}
@keyframes die{to{transform:scale(1.4) translateY(10px);opacity:0}}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.shake{animation:shake .25s 2}
.tag{display:inline-block;background:var(--ink);color:var(--yel);font-size:12px;padding:3px 8px;margin-bottom:8px}
.scene{font-size:17px;font-weight:600}
.prompt-def{font-size:15px}
.opts{display:flex;flex-direction:column;gap:12px;margin:14px 4px}
.opt{font:inherit;font-size:15px;text-align:right;background:#fff;color:var(--ink);border:0;padding:11px 12px;cursor:pointer;box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 #0002;line-height:1.45}
.opt:active{transform:translate(2px,2px)}
.opt.ok{background:#8ff0b5}.opt.bad{background:#ff9aa5;text-decoration:line-through}
.opt:disabled{cursor:default;color:var(--ink)}
.timer{height:8px;background:#0005;margin:8px 4px 0;box-shadow:0 0 0 2px var(--ink)}
.timer i{display:block;height:100%;background:var(--yel)}
.timer.low i{background:var(--red)}
.fb{margin:16px 4px;padding:12px 14px;box-shadow:0 0 0 4px var(--ink);line-height:1.55}
.fb.good{background:#d4f8e2}.fb.bad{background:#ffe0e3}
.fbh{font-weight:800;font-size:17px;margin-bottom:6px}
.fbh .px{font-size:10px;color:var(--grn)}
.def .dn{font-weight:800}
.def p{margin:6px 0}
.def ul{margin:4px 0;padding-inline-start:20px}
.pg{font-size:11px;opacity:.6;font-weight:400}
.mn{background:var(--yel);padding:4px 8px;margin-top:6px;font-weight:600;box-shadow:0 0 0 2px var(--ink)}
.why{font-size:14px;background:#fff;padding:6px 8px;margin:6px 0;box-shadow:0 0 0 2px #0002}
details summary{cursor:pointer;font-weight:600}
/* flash card */
.card{min-height:300px;background:#fff;margin:18px 4px;padding:18px 16px;box-shadow:0 0 0 4px var(--ink),6px 6px 0 4px #0006;cursor:pointer;display:flex;flex-direction:column;justify-content:center;transition:transform .15s steps(3)}
.card.flip{transform:scaleX(0)}
.card .big{font-size:26px;font-weight:800;text-align:center;line-height:1.3}
.card .hint{text-align:center;opacity:.55;font-size:13px;margin-top:18px}
.card.back{cursor:default;justify-content:flex-start;background:var(--cream)}
/* builder */
.frame{display:grid;gap:8px;margin:14px 4px}
.slot{display:flex;gap:8px;align-items:flex-start;background:#ffffff22;color:#fff;padding:7px 8px;box-shadow:0 0 0 2px #ffffff55;font-size:14px;line-height:1.4}
.slot b{flex:0 0 auto;background:#fff3;padding:1px 6px}
.slot.on{box-shadow:0 0 0 3px var(--yel);background:#ffd23f33}
.slot.done{background:var(--cream);color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.slot.done b{background:var(--grn);color:#fff}
.slot .st{opacity:.7}
.blocks .opt{position:relative}
.model .lab{display:inline-block;background:var(--pur);color:#fff;font-weight:800;padding:0 6px;margin-inline-end:6px}
.model p{margin:6px 0}
/* misc */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--yel);padding:10px 14px;box-shadow:0 0 0 3px var(--yel);font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.weak .w{display:flex;justify-content:space-between;gap:8px;align-items:center}
.weak .cnt{font-size:9px;white-space:nowrap}
.cnt .r{color:var(--grn)}.cnt .e{color:var(--red)}
.small{font-size:13px;opacity:.8}
.chip.n{background:#ddd8ea;color:#5b5470}
.learn .big{font-size:24px;font-weight:800;margin:4px 0 2px;line-height:1.3}
.learn h4,.box h4{margin:12px 0 4px}
.pieces{margin:4px 0;padding-inline-start:22px}.pieces li{margin:4px 0}
mark{background:var(--yel);padding:0 2px}
.why2{margin-top:10px;background:#fff;padding:6px 8px;box-shadow:0 0 0 2px #0002}
.warn{background:#ffe9c7}
.cmp{border-inline-start:10px solid var(--c)}.cmph{font-weight:800;font-size:18px;color:var(--ink);margin-bottom:4px}
.cmp p{margin:4px 0}
.blank{color:var(--pur)}
.prog{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.prog span{width:62px}.prog .bar{height:12px;box-shadow:0 0 0 2px var(--ink)}.prog b{font-size:10px}
.btn .sd{color:inherit}
.link{background:none;border:0;color:#d9d2ff;text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;display:block;margin:14px auto 0}
code{background:var(--ink);color:var(--yel);padding:2px 6px;direction:ltr;display:inline-block}
</style>
</head>
<body>
<div id="app"><div class="box center">טוען…</div></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- state ---------- */
const LS='ezrahut-pixel-v1';
const S=Object.assign({xp:0,streak:0,best:0,stats:{},prog:{},snd:true},(()=>{try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}})());
let cloud=null,cloudT;
function save(){S.saved=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 if(cloud){clearTimeout(cloudT);cloudT=setTimeout(()=>{cloud.set(JSON.parse(JSON.stringify(S))).catch(()=>{})},1200)}}
/* cloud sync when running as a claude.ai artifact (private per user) */
async function initCloud(){try{if(!window.claude||!window.claude.use)return;
 const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);if(!user||!db)return;
 const id=await user.id();if(!id)return;const ref=db.doc('data/users/'+id+'/progress');
 const snap=await ref.get();const r=snap.exists?snap.data():null;
 if(r&&(r.saved||0)>(S.saved||0)){Object.assign(S,JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!R&&D)showMap()}
 cloud=ref;if(!r||(S.saved||0)>(r.saved||0))save();toast('☁️ ההתקדמות נשמרת בחשבון')}catch(e){}}
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const $=s=>app.querySelector(s);
let D,C={},R=null,timer=null;

const WS={elections:{icon:'🗳️',col:'#ff6fa5',mon:'#ff9ccb'},culture:{icon:'🎭',col:'#8f5cff',mon:'#b99bff'},limits:{icon:'⚖️',col:'#ff9f1c',mon:'#ffc15e'},obedience:{icon:'🚨',col:'#ff4d5e',mon:'#ff9a9a'},rights:{icon:'✊',col:'#2ec27e',mon:'#86e8b2'},defense:{icon:'🛡️',col:'#3a86ff',mon:'#8fb8ff'}};
const STAGES=[
 {k:'learn',ic:'📖',n:'לימוד',d:'מושגים חדשים בקבוצות של 3: הסבר, דוגמה, השוואה ותרגול'},
 {k:'flash',ic:'🃏',n:'קלפים',d:'הפוך קלף – ידעתי / לא ידעתי'},
 {k:'id',ic:'👾',n:'זיהוי',d:'סיטואציה ← בחר מושג. פגע במפלצת!'},
 {k:'build',ic:'🧱',n:'בונה תשובה',d:'הצג ← הסבר ← צטט ← קשר'},
 {k:'boss',ic:'👑',n:'בוס',d:'10 שאלות מעורבות, טיימר, 3 לבבות'}];
const TITLES=['טירון/ית','מצביע/ה','פעיל/ה','חבר/ת מועצה','ח״כ','שר/ה','יו״ר הכנסת','שופט/ת עליון','נשיא/ה','אגדה דמוקרטית'];
const BOSS_T=20;

/* ---------- pixel sprites ---------- */
function sprite(rows,pal,px,cls){const h=rows.length,w=rows[0].length;let r='';rows.forEach((row,y)=>{let x=0;while(x<w){const ch=row[x];if(ch==='.'){x++;continue}let e=x;while(e<w&&row[e]===ch)e++;r+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${pal[ch]}"/>`;x=e}});return `<svg class="${cls||''}" viewBox="0 0 ${w} ${h}" width="${w*px}" height="${h*px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const MON=["....kkkk....","..kkggggkk..",".kggggggllk.","kggwwggwwggk","kggwkggwkggk","kggggggggggk","kgggkkkkgggk","kggggrrggggk",".kggggggggk.","..kkkkkkkk.."];
const CROWN=["..y..yy..y..","..yyyyyyyy.."];
const HEART=[".rr.rr.","rwrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."];
const STAR=["...y...","..yyy..","yyyyyyy",".yyyyy.","..yyy..",".yy.yy.","yy...yy"];
const heart=on=>sprite(HEART,{r:on?'#ff4d5e':'#5b5470',w:on?'#fff':'#7a7390'},3);
const star=on=>sprite(STAR,{y:on?'#ffd23f':'#5b5470'},3);
const stars=n=>[0,1,2].map(k=>star(k<n)).join(' ');
const monster=(col,boss)=>sprite(boss?CROWN.concat(MON):MON,{k:'#1d1a2f',g:col,l:'#fff',w:'#fff',r:'#ff4d5e',y:'#ffd23f'},boss?9:7,'mon');

/* ---------- sound ---------- */
let AC;
const SFX={ok:[[660,.07],[990,.12]],bad:[[220,.12],[150,.2]],flip:[[520,.05]],hit:[[880,.04],[440,.06]],win:[[523,.1],[659,.1],[784,.1],[1047,.3]],lose:[[392,.15],[330,.15],[262,.3]],lvl:[[784,.08],[988,.08],[1175,.08],[1568,.25]]};
function sfx(k){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;for(const [f,d] of SFX[k]){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9}}catch(e){}}

/* ---------- helpers ---------- */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
const lvl=xp=>{let L=1;while(50*L*(L+1)<=xp)L++;return L};
const ttl=L=>TITLES[Math.min(L,TITLES.length)-1];
function hud(){const L=lvl(S.xp),a=50*L*(L-1),b=50*L*(L+1),p=Math.round((S.xp-a)/(b-a)*100);
 return `<div class="hud" id="hud"><span class="lv px">LV${L}</span><span class="ttl">${ttl(L)}</span><div class="xpbar"><i style="width:${p}%"></i></div><span class="px">${S.xp}XP</span><span class="px" title="רצף">🔥${S.streak}</span><button class="icb" id="snd" aria-label="צליל">${S.snd?'🔊':'🔇'}</button></div>`}
function bindHud(){const b=document.getElementById('snd');if(b)b.onclick=()=>{S.snd=!S.snd;save();b.textContent=S.snd?'🔊':'🔇'}}
function refreshHud(){const h=document.getElementById('hud');if(h){h.outerHTML=hud();bindHud()}}
function gain(n){const b=lvl(S.xp);S.xp+=n;const a=lvl(S.xp);if(a>b){setTimeout(()=>{toast(`⬆️ רמה ${a}! ${ttl(a)}`);sfx('lvl')},300)}save()}
const byWorld=w=>D.concepts.filter(c=>c.world===w).map(c=>c.id);
const splitW=n=>{const i=n.indexOf(':');return i<0?['',n]:[n.slice(0,i),n.slice(i+1).trim()]};
const box=id=>S.stats[id]?S.stats[id].b:1;
const weakFirst=ids=>shuffle(ids).sort((a,b)=>box(a)-box(b));
/* spaced review: minutes until a concept is due again, by box */
const INT=[1,5,20,60,360,1440];
function record(id,ok){const s=S.stats[id]||(S.stats[id]={r:0,w:0,b:1});if(ok){s.r++;s.b=Math.min(s.b+1,5)}else{s.w++;s.b=0}s.t=Date.now();s.due=s.t+INT[s.b]*60000;save()}
const learned=id=>!!(S.stats[id]&&S.stats[id].L);
function dueIds(){const n=Date.now();return Object.keys(S.stats).filter(id=>C[id]&&S.stats[id].L&&(S.stats[id].due||0)<=n).sort((a,b)=>(S.stats[a].due||0)-(S.stats[b].due||0))}
function nextBatch(w){const un=byWorld(w).filter(id=>!learned(id));if(!un.length)return [];if(un.length===4)return un;const b=[un[0]];
 for(const x of C[un[0]].confusables||[])if(b.length<3&&un.includes(x)&&!b.includes(x))b.push(x);
 for(const x of un)if(b.length<3&&!b.includes(x))b.push(x);return b}
function learnStars(w){const ids=byWorld(w),l=ids.filter(learned).length;return l===ids.length?3:l>=ids.length/2?2:l>0?1:0}
const splitSents=t=>t.replace(/(\D)\.\s+/g,'$1.\n').split('\n').map(s=>s.trim()).filter(Boolean);
function hl(text,quote){let h=esc(text);for(const part of quote.split(/\.\.\.|…/).map(s=>s.trim()).filter(s=>s.length>2)){const e=esc(part);if(h.includes(e))h=h.replace(e,`<mark>${e}</mark>`)}return h}
function distractorsPool(id,n,pool){const c=C[id],out=[];const P=pool.filter(x=>x!==id&&C[x]);
 for(const x of shuffle(P))if((c.confusables||[]).includes(x)&&out.length<n)out.push(x);
 for(const x of shuffle(P))if(!out.includes(x)&&out.length<n)out.push(x);
 for(const x of distractors(id,n+3))if(!out.includes(x)&&out.length<n)out.push(x);return out}
/* fill-in-the-blank on the booklet definition */
const STOP=new Set(['אשר','כדי','בין','למשל','כאשר','אינו','אינן','אינם','להיות','שלא','הזכות','זכות','לכל','אדם','באמצעות','מאוד','אותם','אותו','לבין','בהם','שלה','שלו','עצמו','רבות','רבים']);
const cleanTok=t=>t.replace(/^[("'״׳–\-]+|[).,:;"'״–\-]+$/g,'');
const goodW=w=>/^[א-ת]{4,}$/.test(w)&&!STOP.has(w);
function buildCloze(id){const c=C[id],nameW=new Set(c.name.split(/\s+/).map(cleanTok));
 let toks=null,idx=-1;
 for(const s of splitSents(c.definition).slice(0,3)){const t=s.split(/\s+/);const cand=t.map((x,i)=>i).filter(i=>{const w=cleanTok(t[i]);return goodW(w)&&!nameW.has(w)});
  if(cand.length){cand.sort((a,b)=>cleanTok(t[b]).length-cleanTok(t[a]).length);idx=pick(cand.slice(0,4));toks=t;break}}
 if(!toks)return null;
 const word=cleanTok(toks[idx]);const lo=Math.max(0,idx-12),hi=Math.min(toks.length,idx+13);
 const shown=toks.slice(lo,hi).map((t,i)=>i+lo===idx?esc(t.replace(word,'@@')).replace('@@','<b class="blank">_____</b>'):esc(t)).join(' ');
 const pool=[];for(const x of distractors(id,8))for(const t of C[x].definition.split(/\s+/)){const w=cleanTok(t);if(goodW(w)&&w!==word&&!c.definition.includes(w)&&Math.abs(w.length-word.length)<=3&&!pool.includes(w))pool.push(w)}

  q=batch.map(id=>({t:'intro',id}));

  q.push({t:'go'});

  q=q.concat(shuffle(batch).map(id=>({t:pick(['cloze','cloze','def']),id,sc:C[id].scenarios[0],pool:lp})))}

 else if(kind==='id'){const ord=weakFirst(pool);for(let r=0;q.length<10;r++){let any=false;for(const id of ord){const sc=C[id].scenarios[r];if(sc&&q.length<10){q.push({t:'id',id,sc});any=true}}if(!any)break}}

function renderCompare(q){
 app.innerHTML=topBar()+`<div class="box"><span class="tag">🔍 השוואה</span><h3>מושגים דומים: מה ההבדל?</h3><p class="small">המושגים האלה דומים ונוטים להתבלבל ביניהם. שים/י לב מה מבדיל כל אחד מהאחרים.</p></div>
 ${q.ids.map((id,i)=>{const c=C[id],sc=c.scenarios[0];return `<div class="box cmp" style="--c:${['#ff6fa5','#3a86ff','#2ec27e','#ff9f1c'][i%4]}"><div class="cmph">${esc(c.name)}</div><p><b>בקצרה:</b> ${esc(keyOf(id))}</p><p><b>דוגמה:</b> "${esc(sc.quote)}"</p></div>`}).join('')}
 <button class="btn grn" id="go">הבנתי את ההבדל ◀</button>`;
 bindTop();$('#go').onclick=()=>{sfx('flip');R.i++;next()}}
function renderGo(){
 app.innerHTML=topBar()+`<div class="box center"><div style="font-size:40px">🧠</div><h3>עכשיו מנסים להיזכר</h3><p>לשלוף מהזיכרון מקבע אותו הרבה יותר מקריאה חוזרת. מותר לטעות: מושג שטעית בו יחזור עוד מעט, עד שתענה/י עליו נכון.</p></div><button class="btn grn" id="go">יאללה ◀</button>`;
 bindTop();$('#go').onclick=()=>{R.i++;next()}}

function runTitle(){if(R.label)return R.label;if(R.kind==='practice')return '🎯 תרגול מושגים חלשים';const st=STAGES.find(s=>s.k===R.kind);return `${st.ic} ${st.n} · ${esc(splitW(D.worlds.find(w=>w.id===R.wid).name)[1])}`}
function topBar(){const p=Math.round(R.i/R.q.length*100);
 const h=R.hearts===Infinity?'<span class="px" style="font-size:12px">∞</span>'+heart(true):[0,1,2].map(k=>heart(k<R.hearts)).join('');
 return `<div class="top"><button class="x" id="quit" aria-label="יציאה">✕</button><div class="bar"><i style="width:${p}%"></i></div><div class="hearts" id="hearts">${h}</div></div><div class="sub"><span>${runTitle()}</span><span class="px">🔥${S.streak}</span></div>`}
function arena(){if(R.kind!=='id'&&R.kind!=='boss')return '';const boss=R.kind==='boss';const col=(WS[R.wid]||{}).mon||'#7be0a8';
 return `<div class="arena" id="arena">${monster(col,boss)}<div class="hp"><i id="hpb" style="width:${R.hp/R.max*100}%"></i></div></div>`}
function bindTop(){$('#quit').onclick=()=>{clearTimer();R.kind==='practice'?showWeak():showWorld(R.wid)}}
function setHearts(){const h=document.getElementById('hearts');if(h&&R.hearts!==Infinity)h.innerHTML=[0,1,2].map(k=>heart(k<R.hearts)).join('')}

function onRight(id,silentRecord){if(!silentRecord)record(id,true);S.streak++;S.best=Math.max(S.best,S.streak);const x=10+Math.min(S.streak,10);gain(x);R.ok++;sfx('ok');return x}
function onWrong(id){record(id,false);S.streak=0;save();R.missed.add(id);sfx('bad');
 if(R.hearts!==Infinity){R.hearts--;setHearts();const h=document.getElementById('hearts');if(h){h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake')}}}
function hitMonster(){if(!R.max)return;R.hp=Math.max(0,R.hp-1);const a=document.getElementById('arena');if(!a)return;
 document.getElementById('hpb').style.width=(R.hp/R.max*100)+'%';a.classList.remove('hit');void a.offsetWidth;a.classList.add(R.hp===0?'dead':'hit');
 const d=document.createElement('div');d.className='dmg px';d.textContent='-1';a.appendChild(d);setTimeout(()=>sfx('hit'),120)}

/* ---- choice questions ---- */
function buildChoice(q){const c=C[q.id];
 const dis=n=>q.pool?distractorsPool(q.id,n,q.pool):distractors(q.id,n);
 if(q.t==='cloze'){const z=buildCloze(q.id);if(z)return z;q.t='def'}
 if(q.t==='id'){const ids=shuffle([q.id,...dis(3)]);
  return {prompt:`<span class="tag">🎬 איזה מושג מתאים לסיטואציה?</span><div class="scene">${esc(q.sc.text)}</div>`,opts:ids.map(x=>({html:esc(C[x].name),ok:x===q.id,id:x}))}}
 if(q.t==='name'){const ids=shuffle([q.id,...dis(3)]);
  return {prompt:`<span class="tag">📖 איזה מושג מוגדר כך?</span><div class="prompt-def">${maskName(c)}</div>`,opts:ids.map(x=>({html:esc(C[x].name),ok:x===q.id,id:x}))}}
 if(q.t==='def'){const ids=shuffle([q.id,...dis(3)]);const sn=snippets(ids);
  return {prompt:`<span class="tag">🧠 מה ההגדרה?</span><div class="scene">${esc(c.name)}</div>`,opts:ids.map((x,k)=>({html:esc(sn[k]),ok:x===q.id,id:x}))}}
 if(q.t==='quote')return {prompt:`<span class="tag">💬 איזה משפט מדגים את: ${esc(c.name)}?</span><div class="scene">${esc(q.sc.text)}</div>`,opts:quoteOpts(q.sc,q.id)};
}
function renderChoice(q){const b=q.b||(q.b=buildChoice(q));const boss=R.kind==='boss';
 app.innerHTML=topBar()+arena()+`<div class="box">${b.prompt}${boss?'<div class="timer" id="tm"><i style="width:100%"></i></div>':''}</div><div class="opts">${b.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.html}</button>`).join('')}</div><div id="fb"></div>`;
 bindTop();
 const btns=[...app.querySelectorAll('.opt')];
 const answer=k=>{clearTimer();btns.forEach((x,j)=>{x.disabled=true;if(b.opts[j].ok)x.classList.add('ok')});
  const o=k>=0?b.opts[k]:null,ok=!!(o&&o.ok);let extra='';
  if(o&&!ok){btns[k].classList.add('bad');if(o.id&&C[o.id])extra=`<div class="why">מה שבחרת – <b>${esc(C[o.id].name)}</b>: ${esc(firstSent(C[o.id].definition))}</div>`;else if(o.why)extra=`<div class="why">${esc(o.why)}</div>`}
  if(k<0)extra='<div class="why">⏰ נגמר הזמן!</div>';
  let x=0;if(ok){x=onRight(q.id);hitMonster()}else{onWrong(q.id);
   const copy={t:q.t,id:q.id,sc:q.sc};copy.pool=q.pool;if(R.kind==='boss')R.q.push(copy);else R.q.splice(Math.min(R.i+(R.kind==='learn'?2:3),R.q.length),0,copy)}
  refreshTop();
  showFb(ok,q.id,extra,x)};
 btns.forEach((x,k)=>x.onclick=()=>answer(k));
 if(boss){let left=BOSS_T*10;const tm=document.getElementById('tm'),bar=tm.firstChild;
  timer=setInterval(()=>{left--;bar.style.width=(left/(BOSS_T*10)*100)+'%';if(left<=50)tm.classList.add('low');if(left<=0)answer(-1)},100)}}
function refreshTop(){const s=app.querySelector('.sub .px');if(s)s.textContent='🔥'+S.streak}
function showFb(ok,id,extra,x){const c=C[id];const fb=document.getElementById('fb');
 fb.innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="fbh">${ok?`✔ נכון! <span class="px">+${x}XP</span>`:`✘ לא נכון. התשובה: ${esc(c.name)}`}</div>${extra}${ok?`<details><summary>הצג הגדרה</summary>${defHtml(c)}</details>`:defHtml(c)}<button class="btn" id="go">המשך ◀</button></div>`;
 const go=document.getElementById('go');go.onclick=()=>{R.i++;next()};
 setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}

/* ---- flash cards ---- */
function renderFlash(q){const c=C[q.id];
 app.innerHTML=topBar()+`<div class="card" id="card"><div class="small center">${esc(splitW(D.worlds.find(w=>w.id===c.world).name)[1])} · עמ׳ ${c.page}</div><div class="big" style="margin-top:20px">${esc(c.name)}</div><div class="hint">👆 נסה/י להיזכר בהגדרה ואז לחץ/י להפוך</div></div><div id="fbtns"></div>`;
 bindTop();const card=$('#card');
 card.onclick=()=>{if(card.dataset.f)return;card.dataset.f=1;sfx('flip');card.classList.add('flip');
  setTimeout(()=>{card.classList.add('back');card.innerHTML=defHtml(c);card.classList.remove('flip');
   $('#fbtns').innerHTML=`<div class="row"><button class="btn red" id="no">✘ לא ידעתי</button><button class="btn grn" id="yes">✔ ידעתי</button></div>`;
   $('#yes').onclick=()=>{record(q.id,true);if(!R.seen.has(q.id))R.firstTry.add(q.id);R.seen.add(q.id);S.streak++;S.best=Math.max(S.best,S.streak);gain(5);sfx('ok');R.i++;next()};
   $('#no').onclick=()=>{record(q.id,false);R.seen.add(q.id);R.missed.add(q.id);S.streak=0;save();sfx('bad');
    if((q.rep||0)<2)R.q.splice(Math.min(R.i+3,R.q.length),0,{t:'flash',id:q.id,rep:(q.rep||0)+1});R.i++;next()}},150)}}

/* ---- answer builder ---- */
const LABELS=()=>D.meta.answer_structure.map(s=>s.split(' – ')[0]);
function renderBuild(q){const c=C[q.id];q.step=q.step||0;const L=LABELS();
 if(!q.parts){const other=distractors(q.id,1)[0];const qt=`"${esc(q.sc.quote)}"`;
  q.parts=[esc(c.name),esc(cut(c.definition,110)),qt,`במשפט ${qt} רואים את ${esc(c.name)}: ${esc(keyOf(q.id))}`];
  const dids=shuffle([q.id,...distractors(q.id,2)]),sn=snippets(dids);
  q.opts=[
   shuffle([q.id,...distractors(q.id,3)]).map(x=>({html:esc(C[x].name),ok:x===q.id,id:x})),
   dids.map((x,k)=>({html:esc(sn[k]),ok:x===q.id,why:x===q.id?'':`זו ההגדרה של "${C[x].name}".`})),
   quoteOpts(q.sc,q.id),
   shuffle([{html:q.parts[3],ok:true},
    {html:`במשפט ${qt} מתואר מה שקרה בסיפור, ולכן זה ${esc(c.name)}.`,ok:false,why:'זה רק חוזר על הסיפור. קשר טוב מחבר בין הציטוט לבין ההגדרה.'},
    {html:`במשפט ${qt} רואים את ${esc(c.name)}: ${esc(keyOf(other))}`,ok:false,why:`ההסבר הזה שייך למושג אחר: "${C[other].name}".`}])];
  q.order=shuffle([0,1,2,3]);q.ord=0}
 const hints=['איזה מושג מודגם בסיטואציה?','בחר/י את ההגדרה של המושג','בחר/י את המשפט מהסיטואציה שמדגים את המושג','בחר/י משפט קישור שמחבר ציטוט ↔ הגדרה','עכשיו סדר/י את 4 החלקים לפי סדר התשובה'];
 const frame=`<div class="frame">${L.map((l,k)=>{const done=q.step>4?true:(q.step===4?k<q.ord:k<q.step);const on=q.step<4?k===q.step:(q.step===4&&k===q.ord);
  return `<div class="slot ${done?'done':''} ${on?'on':''}"><b>${k+1}. ${esc(l)}</b><span class="${done?'':'st'}">${done?q.parts[k]:'…'}</span></div>`}).join('')}</div>`;
 let body='';
 if(q.step<4)body=`<div class="opts">${q.opts[q.step].map((o,k)=>`<button class="opt" data-k="${k}">${o.html}</button>`).join('')}</div><div id="why"></div>`;
 else if(q.step===4)body=`<div class="opts blocks">${q.order.map(k=>`<button class="opt" data-b="${k}" ${k<q.ord?'disabled style="opacity:.35"':''}>${q.parts[k]}</button>`).join('')}</div>`;
 else body=`<div class="box model"><h3>✅ תשובה מלאה</h3>${L.map((l,k)=>`<p><span class="lab">${esc(l)}</span>${k===1?esc(c.definition):q.parts[k]}</p>`).join('')}${c.mnemonic?`<div class="mn">🔑 ${esc(c.mnemonic)}</div>`:''}<button class="btn" id="go">המשך ◀</button></div>`;
 app.innerHTML=topBar()+`<div class="box"><span class="tag">🎬 סיטואציה</span><div class="scene">${esc(q.sc.text)}</div></div><div class="sub" style="margin-top:4px"><span>👉 ${hints[Math.min(q.step,4)]}</span></div>${frame}${body}`;
 bindTop();
 if(q.step<4)app.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const o=q.opts[q.step][+btn.dataset.k];
  if(o.ok){sfx('ok');q.step++;if(q.step===4&&!q.err){}renderBuild(q)}
  else{btn.disabled=true;btn.classList.add('bad');if(!q.err){q.err=true}onWrong(q.id);
   document.getElementById('why').innerHTML=o.why?`<div class="fb bad"><div class="why">${esc(o.why)}</div></div>`:'';
   if(R.hearts<=0){app.querySelectorAll('.opt').forEach(b=>b.disabled=true);const run=R;setTimeout(()=>{if(R===run)gameOver()},700)}}});
 else if(q.step===4)app.querySelectorAll('[data-b]').forEach(btn=>btn.onclick=()=>{const k=+btn.dataset.b;
  if(k===q.ord){sfx('flip');q.ord++;if(q.ord===4){q.step=5;if(!q.err){const x=onRight(q.id);toast(`✔ תשובה מושלמת! +${x}XP`)}else{sfx('ok')}}renderBuild(q)}
  else{btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');toast(`רמז: עכשיו "${L[q.ord]}"`)}});
 else $('#go').onclick=()=>{R.i++;next()}}

/* ---- end screens ---- */
function win(){clearTimer();const k=R.kind;let st=3,bonus=0;
 if(k==='flash'){const n=new Set(R.q.map(q=>q.id)).size;const f=R.firstTry.size/n;st=f>=.9?3:f>=.6?2:1;bonus=20}
 else if(k==='practice'){st=0;bonus=15}
 else if(k==='learn'){bonus=15;for(const id of R.batch){const s=S.stats[id]||(S.stats[id]={r:0,w:0,b:1,due:0});s.L=1;if(!s.due||s.due>Date.now()+INT[1]*60000)s.due=Date.now()+INT[1]*60000}st=learnStars(R.wid);save()}
 else{st=Math.max(1,R.hearts);bonus=k==='boss'?50:20}
 gain(bonus);
 if(R.wid&&k!=='practice'&&k!=='learn'){const p=S.prog[R.wid]||(S.prog[R.wid]={});p[k]=Math.max(p[k]||0,st);save()}
 sfx('win');
 const missed=[...R.missed];const still=k==='practice'?weakIds().length:0;
 app.innerHTML=hud()+`<div class="box center"><h2>${k==='boss'?'👑 הבוס הובס!':k==='practice'?'🎯 סיימת תרגול!':k==='learn'?(R.batch.length===1?'🎓 למדת מושג חדש!':'🎓 למדת '+R.batch.length+' מושגים!'):'🎉 שלב הושלם!'}</h2>
 ${k==='learn'?`<div class="chips" style="justify-content:center;margin:8px 0">${R.batch.map(id=>`<span class="chip g">${esc(C[id].name)}</span>`).join('')}</div><p class="small">בעולם הזה למדת ${byWorld(R.wid).filter(learned).length} מתוך ${byWorld(R.wid).length}. המושגים יחזרו בחזרה המרווחת (⏰) בעוד כמה דקות.</p>`:''}
 ${st?`<div style="margin:10px 0">${stars(st).replace(/width="21" height="21"/g,'width="36" height="36"')}</div>`:''}
 <div class="px" style="font-size:12px;margin:10px 0">+${S.xp-R.xp0} XP</div>
 ${k==='practice'?`<p>נשארו ${still} מושגים חלשים.</p>`:''}
 ${missed.length?`<p><b>כדאי לחזור על:</b></p><div class="chips" style="justify-content:center">${missed.map(id=>`<span class="chip w">${esc(C[id].name)}</span>`).join('')}</div>`:'<p>בלי אף טעות! 💪</p>'}</div>
 ${k==='learn'&&nextBatch(R.wid).length?'<button class="btn grn" id="nb">📖 לקבוצה הבאה</button>':''}${k==='learn'&&!nextBatch(R.wid).length?'<button class="btn grn" id="nid">👾 סיימת ללמוד את העולם! לשלב הזיהוי</button>':''}<button class="btn ${k==='learn'?'gray':'grn'}" id="again">🔁 שוב</button><button class="btn blue" id="nx">⭐ המשך ללמוד (הצעד הבא)</button>${k==='practice'?'<button class="btn pink" id="wk">💔 לרשימת החלשים</button>':'<button class="btn" id="world">◀ חזרה לעולם</button>'}<button class="btn gray" id="map">🗺️ מפה</button>`;
 bindHud();endBinds()}
function gameOver(){clearTimer();sfx('lose');const missed=[...R.missed];
 app.innerHTML=hud()+`<div class="box center"><h2>💔 נגמרו הלבבות</h2><div>${monster((WS[R.wid]||{}).mon||'#aaa',R.kind==='boss')}</div><p>לא נורא – המושגים שטעית בהם יחזרו מוקדם יותר בפעם הבאה.</p>
 <div class="chips" style="justify-content:center">${missed.map(id=>`<span class="chip w">${esc(C[id].name)}</span>`).join('')}</div></div>
 ${missed.map(id=>`<details class="box"><summary>${esc(C[id].name)}</summary>${defHtml(C[id])}</details>`).join('')}
 <button class="btn grn" id="again">🔁 נסה/י שוב</button><button class="btn blue" id="nx">⭐ המשך ללמוד (הצעד הבא)</button><button class="btn" id="world">◀ חזרה לעולם</button><button class="btn gray" id="map">🗺️ מפה</button>`;
 bindHud();endBinds()}
function endBinds(){const k=R.kind,w=R.wid,ids=R.ids,label=R.label,batch=R.batch;
 $('#again').onclick=()=>k==='practice'?(label?startRun('practice',null,ids,label):weakIds().length?startRun('practice',null,weakIds()):showWeak()):k==='learn'?startRun('learn',w,batch):startRun(k,w);
 const nb=$('#nb');if(nb)nb.onclick=()=>startRun('learn',w);const ni=$('#nid');if(ni)ni.onclick=()=>startRun('id',w);
 const nx=$('#nx');if(nx)nx.onclick=()=>nextAction().go();
 const wb=$('#world');if(wb)wb.onclick=()=>showWorld(w);const wk=$('#wk');if(wk)wk.onclick=showWeak;$('#map').onclick=showMap;window.scrollTo(0,0)}
</script>
</body>
